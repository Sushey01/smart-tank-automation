# Optional path. Do not use this at the same time as the host replica set.
# Published ports are 27217-27219 so this file does not bind 27017
# (often already in use) or the coursework ports 27117-27119.
services:
  mongo1:
    image: mongo:7
    container_name: mongo1
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27217"]
    ports:
      - "27217:27217"
    volumes:
      - mongo1_data:/data/db
  mongo2:
    image: mongo:7
    container_name: mongo2
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27218"]
    ports:
      - "27218:27218"
    volumes:
      - mongo2_data:/data/db
  mongo3:
    image: mongo:7
    container_name: mongo3
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--port", "27219"]
    ports:
      - "27219:27219"
    volumes:
      - mongo3_data:/data/db
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf

volumes:
  mongo1_data:
  mongo2_data:
  mongo3_data:
